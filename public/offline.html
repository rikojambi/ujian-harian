<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2547" />
    <title>Offline - UJIAN HARIAN</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f2547;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        width: min(100%, 440px);
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        box-shadow: 0 12px 32px rgba(15, 37, 71, 0.1);
        padding: 32px;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #0f2547;
        color: #fff;
        font-size: 30px;
        font-weight: 800;
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 20px; color: #475569; line-height: 1.6; font-size: 14px; }
      button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        background: #0ea5e9;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #0284c7; }
      small { display: block; margin-top: 14px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">U</div>
      <h1>Sedang offline</h1>
      <p>
        Tampilan aplikasi tersimpan di perangkat. Jawaban yang sedang dikerjakan tetap disimpan
        sementara dan akan dikirim saat koneksi kembali.
      </p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
      <small>UJIAN HARIAN &middot; Mode offline</small>
    </main>
  </body>
</html>
